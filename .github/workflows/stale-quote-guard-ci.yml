## Auto-riparazione quote MetaApi

Il worker controlla la salute delle quote ogni 30 secondi **solo dentro `SCALPER_HOURS_UTC`**. Il normale silenzio fuori fascia/weekend non conta: alla riapertura il timer riparte dall'inizio della sessione. Se una quote valida non arriva entro la soglia, il worker chiude l'istanza streaming MetaApi, crea una nuova connessione, rifà `waitSynchronized()` e risottoscrive XAUUSD. Se il flusso non torna entro la soglia di uscita, salva `stream_worker_status=stale_exit`, invia Telegram con `worker riavviato per quote ferme` ed esce con codice 1, così la policy Railway `ALWAYS` avvia un processo pulito.

Environment del recovery:

- `STALE_QUOTE_SEC` — secondi senza quote prima del reconnect; default `120`.
- `STALE_QUOTE_EXIT_SEC` — secondi senza quote prima di `process.exit(1)`; default `300` (viene mantenuto almeno 30 s sopra la soglia reconnect).
- `RAILWAY_API_TOKEN` — opzionale, **segreto server-only** usato dal watchdog per richiedere il riavvio via Railway GraphQL; se manca il watchdog manda soltanto Telegram.
- `RAILWAY_SERVICE_ID` — ID del servizio Railway da riavviare, cioè `scalper-worker`. Il watchdog risolve l'istanza/environment del servizio e usa `serviceInstanceRedeploy`, con `deploymentRestart` come fallback.

`stream_worker_detail` include `quoteAgeSec` e `quoteReceivedAt`; `stream_last_quote.receivedAt` è il timestamp reale dell'ultima quote valida ricevuta e non viene più avanzato artificialmente dal timer di persistenza. Il watchdog controlla le quote in fascia a 180 secondi, limita l'alert Telegram a uno ogni 10 minuti e prova il riavvio Railway solo quando entrambe le variabili Railway sono presenti.
'''
