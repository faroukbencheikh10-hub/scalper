name: stale-quote-guard-ci

on:
  push:
    branches: [stale-quote-guard]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stale-quote-guard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - name: Apply stale quote guard
        run: python3 scripts/_apply_stale_quote_guard.py
      - name: Typecheck
        run: npm run typecheck
      - name: Scenarios
        run: npm run scenarios
      - name: Diff safety
        shell: bash
        run: |
          git diff --check
          test -z "$(git diff --name-only | grep -E '(^|/)scalperStrategy\.ts$' || true)"
          git status --short
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/streaming.ts worker/watchdog.ts src/lib/server/staleQuoteGuard.ts scripts/stale-quote-scenarios.ts package.json README.md
          git commit -m "Auto-repair stale MetaApi quote stream"
          git push origin HEAD:stale-quote-guard
